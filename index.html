<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary meta -->
    <title>Free QR Code Generator – Create QR Codes Online, No Sign-Up</title>
    <meta name="description" content="100% free QR code generator. Create custom QR codes for URLs, WiFi, vCard, and more. No account, no limits. Download as PNG, SVG, or PDF. Works offline." />
    <meta name="keywords" content="free qr code generator, qr code maker, create qr code, qr code online, qr generator, qr code png, qr code svg, wifi qr code, vcard qr code" />
    <meta name="robots" content="index, follow" />
    <!-- Canonical and og:url use full URL to avoid Vite treating "/" as a file path (EISDIR). Set at build time via env or replace. -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free QR Code Generator – Create QR Codes Online, No Sign-Up" />
    <meta property="og:description" content="100% free QR code generator. Create custom QR codes for URLs, WiFi, vCard, and more. No account, no limits. Download as PNG, SVG, or PDF." />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:site_name" content="Free QR Code Generator" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free QR Code Generator – Create QR Codes Online, No Sign-Up" />
    <meta name="twitter:description" content="100% free QR code generator. Create custom QR codes for URLs, WiFi, vCard, and more. No account, no limits. Download as PNG, SVG, or PDF." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Free QR Code Generator",
        "description": "100% free QR code generator. Create custom QR codes for URLs, WiFi, vCard, email, phone, and more. No account, no limits. Download as PNG, SVG, or PDF.",
        "url": "https://example.com/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Create QR codes for URL, text, WiFi, vCard, email, SMS, phone, location",
          "Custom colors, styles, and center logo",
          "Export as PNG, SVG, JPG, or PDF",
          "No registration, no limits, works in browser"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
